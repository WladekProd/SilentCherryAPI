name: Update Patreon Supporters

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    # This prevents multiple runs from overlapping
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4 # Updated to v4
        with:
          fetch-depth: 0 # Fetches all history so rebase works correctly

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install axios

      - name: Run update script
        id: run_script
        env:
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.REFRESH_TOKEN }}
          CAMPAIGN_ID: ${{ secrets.CAMPAIGN_ID }}
        run: node script.js

      - name: Update REFRESH_TOKEN Secret
        if: always() && steps.run_script.outputs.token != ''
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          NEW_TOKEN: ${{ steps.run_script.outputs.token }}
        run: gh secret set REFRESH_TOKEN --body "$NEW_TOKEN"

      - name: Push JSON files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          # Явно добавляем только те файлы, которые нам нужны
          git add supporters.json membership_tiers.json
          
          # Проверяем, есть ли изменения именно в этих файлах (staged changes)
          if ! git diff --cached --exit-code; then
            echo "Changes detected in JSON files. Committing..."
            git commit -m "Update Patreon data"
            git pull --rebase origin main
            git push
          else
            echo "No changes in JSON files. Skipping push."
          fi
